aid: jpx
url: https://raw.githubusercontent.com/api-evangelist/jpx/refs/heads/main/apis.yml
name: JPX (Japan Exchange Group)
kind: company
description: JPX (Japan Exchange Group) operates the Tokyo Stock Exchange, Osaka
  Exchange, and Tokyo Commodity Exchange, and sells Japanese market data through
  its JPX Market Innovation & Research arm. Its developer-facing product is the
  J-Quants API - a self-serve, subscription REST API (Free/Light/Standard/Premium
  plans, x-api-key auth, base https://api.jquants.com/v2) delivering historical
  equities OHLCV/minute/tick bars, indices, derivatives, financial statements,
  short-selling and margin data, EDINET filings, and TDnet disclosures, plus bulk
  CSV download, an MCP server, and a CLI - licensed to individual investors only.
  Institutional real-time data (FLEX Standard and FLEX MBO order-book feeds) and
  corporate historical data (J-Quants Pro via API/SFTP/Snowflake, J-Quants
  DataCube) are sales-gated services.
